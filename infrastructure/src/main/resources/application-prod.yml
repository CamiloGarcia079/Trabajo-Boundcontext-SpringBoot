# En producción nada de credenciales escritas aquí: todo llega por variables de entorno.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": mindconnect_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    init-sqls:
      - CREATE SCHEMA IF NOT EXISTS mindconnect_schema
    schemas:
      - mindconnect_schema
    default-schema: mindconnect_schema
    table: flyway_schema_history_mindconnect
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      db_schema: mindconnect_schema

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
